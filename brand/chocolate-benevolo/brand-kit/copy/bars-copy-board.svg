    <text class="body" x="980" y="630" font-size="20">NSA-0011242-2021</text>
    <text class="body" x="980" y="670" font-size="20">Contacto: +573102227848</text>
    <text class="body" x="980" y="710" font-size="20">Chocolate Benevolo.co</text></g>

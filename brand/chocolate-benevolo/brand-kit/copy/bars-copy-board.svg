    <text class="body" x="980" y="400" font-size="20">con fermentación controlada.</text>
    <text class="body" x="980" y="450" font-size="20">Leche en polvo avellanada y marañón salado.</text></g>
  <g id="type-manufacturer"><text class="kicker" x="980" y="540" font-size="16">TYPE-MANUFACTURER</text>

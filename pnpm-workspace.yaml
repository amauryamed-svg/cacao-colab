packages:
  - "apps/*"
  - "packages/*"
publicHoistPattern:
  - "*"
allowBuilds:
  '@google/genai': false
  '@sentry/cli': true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.21'
  - hyperframes@0.7.86

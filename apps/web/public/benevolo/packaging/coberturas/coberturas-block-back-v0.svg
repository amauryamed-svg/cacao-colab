<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="140mm" height="90mm"
  viewBox="0 0 140 90" role="img" aria-label="Benevolo Coberturas. · dorso V0">
  <title>Benevolo Coberturas. · dorso V0</title>
  <desc>Chocolate Benevolo · plano V0 diseño. Sustituir DIELINE por archivo de fábrica antes de troquel.</desc>
  <g id="ARTWORK">
    <rect x="-3" y="-3" width="146" height="96" fill="#F7F1EE"/>
    <text x="8" y="12" font-family="Georgia, serif" font-size="6" fill="#15243F" font-weight="700">Ficha técnica · Coberturas.</text>
    <text x="8" y="22" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="3.5" fill="#140e0a">% cacao / endulzante / origen / lote — completar por SKU</text>
    <g font-family="Outfit, Helvetica, Arial, sans-serif" font-size="3.3" fill="#140e0a">
      <text x="8" y="34">Uso: temperar · barras · aplicaciones de obrador</text>
      <text x="8" y="42">Nodos de red: CAÚA × Zurych (convergencia Colab)</text>
      <text x="8" y="50">Conservar fresco y seco · lejos de olores fuertes</text>
      <text x="8" y="58">Claims: solo ficha real del lote — sin medallas inventadas</text>
    </g>
    <text x="8" y="78" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="3" fill="#15243F">CHOCOLATE BENEVOLO · R&amp;D Cacao Colab</text>
  <g id="LEGAL">
    <text x="70.0" y="86.5" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="2.4" fill="#15243F" opacity="0.9">chocolatebenevolo.co</text>
  </g>

  </g>
  <g id="BLEED" fill="none" stroke="#00AEEF" stroke-width="0.25" stroke-dasharray="1 1">
    <rect x="-3" y="-3" width="146" height="96"/>
  </g>
  <g id="SAFE" fill="none" stroke="#39B54A" stroke-width="0.25" stroke-dasharray="1.5 1">
    <rect x="4" y="4" width="132" height="82"/>
  </g>
  <g id="DIELINE_CUT" fill="none" stroke="#FF00FF" stroke-width="0.35">
    <rect x="0" y="0" width="140" height="90"/>
  </g>


</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70mm" height="120mm" viewBox="0 0 700 1200"
  role="img" aria-label="Brew. CACAO &amp; LIMÓN">
  <title>Brew. · CACAO &amp; LIMÓN</title>
  <desc>Gaseosa de cacao Benevolo · patrón Waterloo (degradado + fruta + 0/0/0). Sistema propio, no copia IP.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C6D600"/>
      <stop offset="42%" stop-color="#DCE84A"/>
      <stop offset="72%" stop-color="#F2F7B8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <g id="ARTWORK">
    <rect width="700" height="1200" fill="url(#wash)"/>

    <!-- CB lockup -->
    <g id="LOCKUP_CB" transform="translate(36,32)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
      <text x="20" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#FFFFFF">CB</text>
      <text x="48" y="16" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">CHOCOLATE</text>
      <text x="48" y="34" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F7F1EE" letter-spacing="1.2">BENEVOLO</text>
    </g>

    <!-- Wordmark Brew. -->
    <g id="WORDMARK">
      <text x="40" y="130" font-family="Bodoni Moda, Didot, Georgia, serif" font-size="78" font-style="italic" font-weight="900" fill="#C43A18" opacity="0.55">Brew.</text>
      <text x="36" y="126" font-family="Bodoni Moda, Didot, Georgia, serif" font-size="78" font-style="italic" font-weight="900" fill="#FFFFFF">Brew.</text>
    </g>
    <text x="40" y="162" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" letter-spacing="3">SPARKLING CACAO</text>


    <g id="FRUIT" transform="translate(140,340)">
      <ellipse cx="220" cy="160" rx="110" ry="130" fill="#C6D600"/>
      <ellipse cx="220" cy="160" rx="90" ry="108" fill="#DCE84A" opacity="0.35"/>
      <path d="M220 40 C250 70 255 100 245 120" fill="none" stroke="#7A8A00" stroke-width="6"/>
      <ellipse cx="160" cy="200" rx="70" ry="90" fill="#C6D600" opacity="0.9"/>
      <ellipse cx="380" cy="210" rx="26" ry="38" fill="#F05A28"/>
      <path d="M368 192 Q380 186 392 192" fill="none" stroke="#3D2314" stroke-width="2"/>
    </g>

    <!-- Flavor hero (Waterloo stacked name) -->
    <text x="40" y="760" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#15243F" letter-spacing="1">CACAO</text>
    <text x="40" y="820" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#15243F" letter-spacing="1">&amp; LIMÓN</text>
    <text x="40" y="860" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="16" fill="#15243F" opacity="0.7" letter-spacing="1">NATURALLY FLAVORED · GASEOSA DE CACAO</text>
    <text x="40" y="890" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#15243F">Cítrico efervescente con alma de mazorca.</text>


      <g transform="translate(95,980)">
        <rect width="150" height="90" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#15243F" stroke-width="2"/>
        <text x="75" y="42" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#15243F">0</text>
        <text x="75" y="70" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15243F" letter-spacing="2">CAL</text>
      </g>

      <g transform="translate(265,980)">
        <rect width="150" height="90" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#15243F" stroke-width="2"/>
        <text x="75" y="42" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#15243F">0</text>
        <text x="75" y="70" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15243F" letter-spacing="2">AZÚCAR</text>
      </g>

      <g transform="translate(435,980)">
        <rect width="150" height="90" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#15243F" stroke-width="2"/>
        <text x="75" y="42" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#15243F">0</text>
        <text x="75" y="70" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15243F" letter-spacing="2">SODIO</text>
      </g>

    <text x="350" y="1125" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#15243F">355 ml · 12 FL OZ</text>
    <text x="350" y="1155" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="14" fill="#F05A28">chocolatebenevolo.co · FEAR 5</text>
  </g>

  <g id="DIELINE_CUT" fill="none" stroke="#FF00FF" stroke-width="1.5" opacity="0.45">
    <rect x="4" y="4" width="692" height="1192" rx="40"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="180mm" height="95mm" viewBox="0 0 1800 950"
  role="img" aria-labelledby="title desc">
  <title id="title">Bars. Benevolo — frente etiqueta print (arte exacto Colab)</title>
  <desc id="desc">Wrapper 180×95 mm. Arte = packshot oficial bars-fear5 (manga). Bleed 3 mm en layer-guides.</desc>

  <!-- ===================== LAYER: guides / bleed ===================== -->
  <g id="layer-guides" display="none">
    <rect id="bleed" x="-30" y="-30" width="1860" height="1010" fill="none" stroke="#00AEEF" stroke-width="2" stroke-dasharray="8 6"/>
    <rect id="trim" x="0" y="0" width="1800" height="950" fill="none" stroke="#FF00AA" stroke-width="2"/>
    <rect id="safe" x="40" y="40" width="1720" height="870" fill="none" stroke="#00FF88" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- ===================== LAYER: exact Colab packshot art ===================== -->
  <g id="layer-artwork">
    <!-- Arte exacto del diseño propuesto en el Colab (packshot /benevolo/bars-fear5.png) -->
    <image
      id="front-art"
      x="0" y="0" width="1800" height="950"
      preserveAspectRatio="xMidYMid slice"
      href="bars-fear5-front-art.jpg"
      xlink:href="bars-fear5-front-art.jpg"/>
  </g>
</svg>
